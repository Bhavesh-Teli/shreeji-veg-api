name: Deploy to Both Companies

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:
      # ── 1. KARNAVATI AGRO Deployment ──
      - name: Deploy Karnavati Agro
        run: |
          echo "Deploying Karnavati Agro..."

          git config --global --add safe.directory "D:/Easy_FAS_Karna_Veg/Karnavati_Agro_AppMain/KarnavatiAgroApp"
          cd /d "D:\Easy_FAS_Karna_Veg\Karnavati_Agro_AppMain\KarnavatiAgroApp"
          git pull origin main

          cd backend
          call npm install
          call npm run build

          call npx pm2 restart karnavati-agro-api --update-env || call npx pm2 start dist/app.js --name karnavati-agro-api --update-env
          call npx pm2 save

          cd ../frontend
          call npm install
          call npm run build

      # ── 2. SHREEJI VEG Deployment ──
      - name: Deploy Shreeji Veg
        if: always()
        run: |
          echo "Deploying Shreeji Veg..."

          git config --global --add safe.directory "D:/Easy_FAS_Size_Pooja/Shreeji_Veg_AppMain/ShreejiVegApp"
          cd /d "D:\Easy_FAS_Size_Pooja\Shreeji_Veg_AppMain\ShreejiVegApp"
          git pull origin main

          cd backend
          call npm install
          call npm run build

          call npx pm2 restart shreeji-veg-api --update-env || call npx pm2 start dist/app.js --name shreeji-veg-api --update-env
          call npx pm2 save

          cd ../frontend
          call npm install
          call npm run build
